<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Notes durchsuchen</title>
<style>
  :root {
    --bg: #15181b;
    --bg-elevated: #1d2226;
    --border: #2a2f33;
    --text-primary: #e9e6df;
    --text-secondary: #9a968c;
    --accent-misleading: #c1502e;
    --accent-accurate: #4f9b7c;
    --accent-neutral: #6b7280;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.5;
  }

  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }

  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0 0 8px; }

  #stand {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 20px;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

  .filters input[type="text"],
  .filters input[type="date"],
  .filters select {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-family: var(--sans);
  }

  #q { flex: 1 1 200px; }
  #q::placeholder { color: var(--text-secondary); }

  .filters label {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; color: var(--text-secondary);
    background: var(--bg-elevated); border: 1px solid var(--border);
    padding: 0 10px; border-radius: 6px;
  }

  .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }

  select#sort { margin-left: auto; }

  button {
    background: var(--text-primary); color: var(--bg); border: none;
    padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.85; }

  #ergebnisse { display: flex; flex-direction: column; }

  .note {
    display: grid; grid-template-columns: 88px 1fr 28px; gap: 14px;
    padding: 16px 4px 16px 12px; border-bottom: 1px solid var(--border);
    border-left: 3px solid var(--accent-neutral); align-items: start;
  }

  .note.misleading { border-left-color: var(--accent-misleading); }
  .note.accurate { border-left-color: var(--accent-accurate); }

  .note .date { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); padding-top: 2px; }

  .note .tag {
    display: inline-block; font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px;
  }
  .tag.misleading { color: var(--accent-misleading); }
  .tag.accurate { color: var(--accent-accurate); }

  .note .text { font-size: 14px; word-break: break-word; }

  mark.hl {
    background: #e8c547;
    color: #1a1a1a;
    padding: 0 2px;
    border-radius: 2px;
  }

  .note a.link { color: var(--text-secondary); text-decoration: none; font-size: 16px; padding-top: 2px; }
  .note a.link:hover { color: var(--text-primary); }

  .status { color: var(--text-secondary); font-size: 14px; padding: 24px 4px; }

  @media (max-width: 560px) {
    .note {
      grid-template-columns: 1fr 24px;
      grid-template-areas: "date link" "text text";
    }
    .note .date { grid-area: date; }
    .note a.link { grid-area: link; text-align: right; }
    .note .text { grid-area: text; }
  }
</style>
</head>
<body>

<h1>Community Notes durchsuchen</h1>
<p class="subtitle">Archiv der letzten 12 Monate, täglich aktualisiert</p>
<p id="stand">Lade Status...</p>

<div class="filters">
  <input type="text" id="q" placeholder="Stichwort... (AND / OR verwendbar)">
  <select id="classification">
    <option value="">Alle Klassifikationen</option>
    <option value="MISINFORMED_OR_POTENTIALLY_MISLEADING">Irreführend</option>
    <option value="NOT_MISLEADING">Korrekt</option>
  </select>
  <input type="date" id="from" title="Von">
  <input type="date" id="to" title="Bis">
</div>

<div class="row2">
  <label><input type="checkbox" id="sources"> Nur mit Quellenangabe</label>
  <label><input type="checkbox" id="media"> Nur Media-Notes</label>
  <select id="sort">
    <option value="desc">Neueste zuerst</option>
    <option value="asc">Älteste zuerst</option>
  </select>
  <button onclick="suchen()">Suchen</button>
</div>

<div id="ergebnisse"><div class="status">Gib einen Suchbegriff ein oder klicke direkt auf „Suchen“.</div></div>

<script>
const WORKER_URL = "https://notes-worker.twitterdbworker.workers.dev";

function tagInfo(classification) {
  if (classification === "MISINFORMED_OR_POTENTIALLY_MISLEADING") return { css: "misleading", label: "Irreführend" };
  if (classification === "NOT_MISLEADING") return { css: "accurate", label: "Korrekt" };
  return { css: "", label: classification || "Unbekannt" };
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// Nimmt den bereits escapten Text und markiert alle Such-Einzelwörter gelb
function highlight(escapedText, query) {
  if (!query.trim()) return escapedText;
  const terms = query
    .split(/\s+(?:AND|OR)\s+/i)
    .map(t => t.trim())
    .filter(Boolean);

  let result = escapedText;
  for (const term of terms) {
    const re = new RegExp(escapeRegex(term), "gi");
    result = result.replace(re, match => `<mark class="hl">${match}</mark>`);
  }
  return result;
}

async function ladeStatus() {
  try {
    const res = await fetch(`${WORKER_URL}/status`);
    const data = await res.json();
    const neuestesDatum = new Date(Number(data.newest)).toLocaleString("de-DE");
    const aeltestesDatum = new Date(Number(data.oldest)).toLocaleDateString("de-DE");
    document.getElementById("stand").textContent =
      `Stand: ${data.total.toLocaleString("de-DE")} Notes gespeichert · Zeitraum ${aeltestesDatum} bis ${neuestesDatum}`;
  } catch (e) {
    document.getElementById("stand").textContent = "Status konnte nicht geladen werden.";
  }
}
async function suchen() {
  const params = new URLSearchParams();
  const q = document.getElementById("q").value;
  const classification = document.getElementById("classification").value;
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const sort = document.getElementById("sort").value;

  if (q) params.set("q", q);
  if (classification) params.set("classification", classification);
  if (from) params.set("from", from);
  if (to) params.set("to", to);
  if (document.getElementById("sources").checked) params.set("sources", "true");
  if (document.getElementById("media").checked) params.set("media", "true");
  params.set("sort", sort);

  const box = document.getElementById("ergebnisse");
  box.innerHTML = '<div class="status">Lädt...</div>';

  try {
    const res = await fetch(`${WORKER_URL}?${params}`);
    const notes = await res.json();

    if (notes.length === 0) {
      box.innerHTML = '<div class="status">Keine Treffer gefunden.</div>';
      return;
    }

    box.innerHTML = notes.map(n => {
      const tag = tagInfo(n.classification);
      const date = new Date(Number(n.createdAtMillis)).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
      const link = n.tweetId ? `https://x.com/i/web/status/${n.tweetId}` : null;
      const text = highlight(escapeHtml(n.summary), q);
      return `
        <div class="note ${tag.css}">
          <div class="date">${date}<div class="tag ${tag.css}">${tag.label}</div></div>
          <div class="text">${text}</div>
          ${link ? `<a class="link" href="${link}" target="_blank" rel="noopener" title="Original-Post öffnen">↗</a>` : "<span></span>"}
        </div>`;
    }).join("");
  } catch (e) {
    box.innerHTML = '<div class="status">Fehler beim Laden. Ist die Worker-URL korrekt?</div>';
  }
}
document.getElementById("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") suchen();
});
ladeStatus();
</script>
</body>
</html>
